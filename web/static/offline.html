<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Magyar Scrabble — offline</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; text-align: center; background: #f5f5f7; color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
        .card { max-width: 360px; }
        .tile {
            width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 18px; background: #f5e6c8;
            color: #1e293b; font-weight: 800; font-size: 40px; display: flex; align-items: center; justify-content: center;
        }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { margin: 0 0 20px; color: #6e6e73; line-height: 1.45; }
        button {
            font: inherit; font-weight: 600; padding: 12px 24px; border: 0; border-radius: 12px;
            background: #007aff; color: #fff; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="tile" aria-hidden="true">SZ</div>
        <h1 id="title">Nincs internetkapcsolat</h1>
        <p id="text">A játékhoz internetkapcsolat szükséges. Ellenőrizd a hálózatot, majd próbáld újra.</p>
        <button id="retry" type="button">Újrapróbálás</button>
    </div>
    <script>
        (function () {
            var lang = (navigator.language || 'hu').toLowerCase();
            try { var saved = localStorage.getItem('scrabble-lang'); if (saved) lang = saved; } catch (e) { /* tiltva */ }
            if (lang.indexOf('hu') !== 0) {
                document.documentElement.lang = 'en';
                document.getElementById('title').textContent = 'You are offline';
                document.getElementById('text').textContent = 'The game needs an internet connection. Check your network and try again.';
                document.getElementById('retry').textContent = 'Try again';
            }
            document.getElementById('retry').addEventListener('click', function () { location.href = '/'; });
            window.addEventListener('online', function () { location.href = '/'; });
        })();
    </script>
</body>
</html>
